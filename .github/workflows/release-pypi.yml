name: Release (PyPI)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # push di una versione canonica (es. v1.2.3) senza pre-release

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # All action references below pin Node24-native major runtimes (CTN-006, DES-015).
  # 1. Controlla se siamo sul branch corretto
  check-branch:
    runs-on: ubuntu-latest
    outputs:
      is_master: ${{ steps.check.outputs.is_master }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 

      - name: Check if tag is on master
        id: check
        run: |
          git fetch origin master
          if git branch -r --contains ${GITHUB_SHA} | grep -q "origin/master"; then
            echo "✅ Tag ${{ github.ref }} is on master branch. Proceeding with release."
            echo "is_master=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Tag ${{ github.ref }} is not on master branch. Skipping release."
            echo "is_master=false" >> "$GITHUB_OUTPUT"
          fi

  # 1b. No build-preparatory job runs here: distribution archives are pre-built
  # by the local build pipeline and committed in the tagged release commit
  # (DES-057, DES-062). The workflow consumes only those committed archives.

  # 2. Publish distributions tracked at the tagged commit.
  build-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: check-branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify committed distribution artifacts
        run: |
          python - <<'PY'
          """
          @brief Validate non-empty distribution archives tracked by Git.
          @details Reads the repository index under `dist/`, then requires at
          least one existing non-empty sdist and wheel before release actions.
          @return {None} Exits with status 1 when either archive class is absent.
          """
          import pathlib
          import subprocess
          import sys

          tracked_paths = subprocess.run(
              ["git", "ls-files", "-z", "--", "dist"],
              check=True,
              capture_output=True,
          ).stdout.split(bytes([0]))
          artifacts = [
              pathlib.Path(path.decode("utf-8"))
              for path in tracked_paths
              if path
          ]
          for suffix, label in ((".tar.gz", "sdist"), (".whl", "wheel")):
              matching = [
                  path for path in artifacts if path.name.endswith(suffix)
              ]
              if not any(
                  path.is_file() and path.stat().st_size > 0
                  for path in matching
              ):
                  print(
                      f"Missing non-empty tracked {label} archive in dist/.",
                      file=sys.stderr,
                  )
                  raise SystemExit(1)
          PY

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: "COMMIT"
          configurationJson: |
            {
              "categories": [
               { "title": "## ⛰️ Features", "labels": ["new"] },
               { "title": "## 🏗️ Implementations", "labels": ["implement"] },
               { "title": "## 🐛 Bug Fixes", "labels": ["fix"] },
               { "title": "## 🚜 Changes", "labels": ["change"] },
               { "title": "## 🎯 Cover Requirements", "labels": ["cover"] },
               { "title": "## ✨ Refactor", "labels": ["refactor"] },
               { "title": "## 📚 Documentation", "labels": ["docs"] },
               { "title": "## 🎨 Styling", "labels": ["style"] },
               { "title": "## ◀️ Revert", "labels": ["revert"] },
               { "title": "## ⚙️ Miscellaneous Tasks", "labels": ["misc"] },
               { "title": "## 💬 Other", "labels": ["other"] },
               { "title": "## ❓ Unknown", "labels": ["unknown"] },
               { "title": "## 🚀 Release", "labels": ["release"] }
             ],
             "ignore_labels": [
                "release",
                "ignore"
             ],
             "transformers": [
              {
                "pattern": "^[^\\(:\\s]+(\\([^\\)]+\\))?!?:\\s+([\\S]+[\\s\\S]*)",
                "target": "$2 $1"
              }
             ],
             "sort": {
                "order": "ASC",
                "on_property": "mergedAt"
             },
             "template": "#{{CHANGELOG}}\n\n<details>\n<summary>Uncategorized</summary>\n\n#{{UNCATEGORIZED}}\n</details>\n\n**Full Changelog**: [#{{FROM_TAG}}...#{{TO_TAG}}](https://github.com/#{{OWNER}}/#{{REPO}}/compare/#{{FROM_TAG}}...#{{TO_TAG}})",
              "label_extractor": [
               {
                 "pattern": "^([^\\(:\\s]+)(\\([^\\)]+\\))?(!)?:\\s+([\\S]+[\\s\\S]*)",
                 "on_property": "title",
                 "target": "$1"
               }
             ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          files: dist/**/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          tag_name: ${{ github.ref_name }}
          name: ${{github.event.repository.name}} ${{ github.ref_name }}
          body: ${{ steps.build_changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI via OIDC Trusted Publishing
        # CTN-006/DES-016: PyPI publication only for tags reachable from master;
        # develop (and other branch) tags run the release steps without publishing.
        if: needs.check-branch.outputs.is_master == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
